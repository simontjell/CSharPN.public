name: CI

# Bygger og tester CSharPN. Denne workflow synkroniseres til
# simontjell/CSharPN.public og kører dér.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore workloads
        run: dotnet workload restore CSharPN.sln

      - name: Restore
        run: dotnet restore CSharPN.sln

      - name: Build
        run: dotnet build CSharPN.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CSharPN.sln --configuration Release --no-build
